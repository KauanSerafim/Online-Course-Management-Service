spring:
  application:
    name: Online Course Management Service
  config:
    import: optional:classpath:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres_learning_dev_db
    username: ${ENV_ROOT_USER}
    password: ${ENV_ROOT_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.learning.dev: debug
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-stacktrace: on_param
  tomcat:
    threads:
      max: 20