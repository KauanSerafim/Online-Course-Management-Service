name: CI - Spring Boot + Flyway + PostgreSQL + Maven

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Variáveis de ambiente globais para o job
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: testdb
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  SPRING_PROFILES_ACTIVE: test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Criar arquivo .env para Spring Boot
        run: |
          cat > .env << EOF
          DB_HOST=${{ env.DB_HOST }}
          DB_PORT=${{ env.DB_PORT }}
          DB_NAME=${{ env.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILES_ACTIVE }}
          EOF

      - name: Aguardar PostgreSQL estar pronto
        run: |
          until pg_isready -h ${{ env.DB_HOST }} -p ${{ env.DB_PORT }} -U ${{ secrets.DB_USERNAME }}; do
            echo "Aguardando PostgreSQL..."
            sleep 2
          done

      - name: Executar testes
        run: ./mvnw clean test

      - name: Executar build da aplicação
        run: ./mvnw clean compile

      - name: Validar migrações Flyway
        run: ./mvnw flyway:info flyway:validate

      - name: Executar migrações Flyway
        run: ./mvnw flyway:migrate

      - name: Verificar status das migrações
        run: ./mvnw flyway:info

      - name: Executar verificação adicional do banco
        run: |
          # Conecta ao PostgreSQL e lista as tabelas criadas pelas migrações
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h ${{ env.DB_HOST }} -p ${{ env.DB_PORT }} -U ${{ secrets.DB_USERNAME }} -d ${{ env.DB_NAME }} -c "\dt"